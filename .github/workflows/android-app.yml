name: FreeWave Android

on:
  push:
    branches: [android-app]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Download and verify sing-box libbox
        shell: bash
        run: |
          mkdir -p android/app/libs
          curl --fail --location --retry 3 \
            "https://github.com/singbox-android/libbox/releases/download/1.14.4/libbox.aar" \
            --output android/app/libs/libbox.aar
          echo "d2685924a657705beda44e94c6dc499e781df1ad20d65474e3591ec2f8b96465  android/app/libs/libbox.aar" | sha256sum --check -

      - name: Build debug APK
        run: gradle -p android clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeWaveVPN-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
