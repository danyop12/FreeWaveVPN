name: FreeWave update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".gitignore"
      - "sources.txt"
      - "freewave/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: freewave-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Xray-core
        run: |
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip" -o /tmp/xray.zip
          echo "e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  /tmp/xray.zip" | sha256sum -c -
          mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          echo "XRAY_PATH=/tmp/xray/xray" >> "$GITHUB_ENV"

      - name: Check Python syntax
        run: python -m py_compile freewave/*.py

      - name: Build preliminary TCP candidate list
        run: python -m freewave.build

      - name: Verify VLESS and measure performance
        env:
          FREEWAVE_MAX_XRAY_TESTS: "500"
        run: python -m freewave.rank

      - name: Commit generated subscriptions and status
        run: |
          if [ -n "$(git status --porcelain public/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/
            git commit -m "Update verified VLESS subscriptions"
            # Rebase the generated commit on the latest main in case documentation
            # or source changes were pushed while this workflow was testing nodes.
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No subscription changes."
          fi

  report-failure:
    if: failure()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest repository state
        uses: actions/checkout@v4

      - name: Record failed update without deleting last known-good feeds
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("public/health.json")
          try:
              previous = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError, TypeError):
              previous = {}

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          data = {
              "status": "failed",
              "last_attempt_at_utc": now,
              "last_success_at_utc": previous.get("last_success_at_utc"),
              "last_success_validated_count": previous.get("last_success_validated_count"),
              "last_attempt_validated_count": None,
              "last_attempt_tested_count": None,
              "workflow_run_url": os.environ.get("RUN_URL", ""),
              "error": "GitHub Actions update failed; see workflow log.",
          }
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit failed-update status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/health.json
          if ! git diff --cached --quiet; then
            git commit -m "Record failed FreeWave update"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
