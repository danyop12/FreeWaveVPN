name: FreeWave update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.txt"
      - "freewave/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: freewave-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build subscriptions
        run: python -m freewave.build
      - name: Commit generated subscriptions
        run: |
          if [ -n "$(git status --porcelain public/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/
            git commit -m "Update public VLESS subscriptions"
            git push
          else
            echo "No subscription changes."
          fi
